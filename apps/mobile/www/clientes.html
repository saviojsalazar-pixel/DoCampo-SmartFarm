<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075f3d"><title>Clientes e propriedades • Do Campo</title><link rel="stylesheet" href="admin.css"></head><body><header><div class="head"><a class="back" href="index.html">‹</a><img class="logo" src="assets/logo.png"><div><h1>Clientes e propriedades</h1><p>Produtores, fazendas e talhões — disponíveis offline</p></div></div></header><main><div class="tabs"><button id="activeTab" class="secondary on">Cadastros ativos</button><button id="trashTab" class="secondary">Excluídos</button></div><div class="toolbar"><input id="search" placeholder="Pesquisar produtor, fazenda ou talhão"><button id="new" class="primary">+ Novo cadastro</button></div><div id="list" class="list"></div></main>
<div class="importbar"><button id="importBulk" class="secondary">↑ Importar planilha</button><a class="secondary" href="assets/Modelo_Importacao_SmartFarm.xlsx" download="Modelo_Importacao_SmartFarm.xlsx">↓ Baixar modelo XLSX</a><input id="importFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden></div><div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Novo cadastro</h2><button id="close" class="close">×</button></div><div class="grid"><div class="wide"><label>Produtor *</label><input id="producer"></div><div class="wide"><label>Fazenda / propriedade *</label><input id="farm"></div><div><label>CPF</label><input id="cpf"></div><div><label>Município / endereço</label><input id="address"></div></div><div class="section">Talhões</div><div id="fields"></div><button id="addField" class="secondary" style="margin-top:9px">+ Adicionar talhão</button><div class="actions" style="justify-content:flex-end;margin-top:16px"><button id="cancel" class="secondary">Cancelar</button><button id="save" class="primary">Salvar cadastro</button></div></div></div>
<script src="unified-db.js"></script><script src="shared-data.js"></script><script src="registry-loader.js"></script><script src="bulk-import.js"></script><script src="app-shell.js"></script><script>(function(){'use strict';const $=id=>document.getElementById(id),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=[],editing='',trash=false;
async function load(){data=(await DoCampoRegistry.all()).farms;render()}function render(){const q=$('search').value.toLowerCase();if(trash){const items=DoCampoDB.list('farms',{deleted:true}).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));$('list').innerHTML=items.length?items.map(x=>`<div class="card"><div class="row"><div class="grow"><h2>${esc(x.producerName||'Produtor não informado')}</h2><p class="meta">${esc(x.name)} • excluído em ${new Date(x.deletedAt).toLocaleDateString('pt-BR')}</p></div><button class="secondary" data-restore="${x.id}">Recuperar</button></div></div>`).join(''):'<div class="empty">Nenhum cadastro excluído.</div>';$('list').querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{DoCampoData.restoreFarm(b.dataset.restore);load()});return}const items=data.filter(f=>!q||JSON.stringify(f).toLowerCase().includes(q));$('list').innerHTML=items.length?items.map((f,i)=>`<div class="card"><div class="row"><div class="grow"><h2>${esc(f.producer||f.proprietor||'Produtor não informado')}</h2><p class="meta"><b>${esc(f.farm)}</b>${f.cpf?' • CPF '+esc(f.cpf):''}${f.address?' • '+esc(f.address):''}</p><div class="fields-list">${(f.fields||[]).length?(f.fields||[]).map(x=>`${esc(x.name)} — ${Number(x.area)||0} ha`).join(' • '):'Nenhum talhão cadastrado'}</div></div></div><div class="actions"><button class="secondary" data-edit="${i}">Editar</button><button class="danger" data-del="${i}">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhum cadastro encontrado.</div>';$('list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(items[b.dataset.edit]));$('list').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const f=items[b.dataset.del];if(confirm('Excluir '+f.farm+'? O cadastro poderá ser recuperado.')){DoCampoData.removeFarm(f.farm);load()}})}
const fieldCmp=(a,b)=>String(a||'').localeCompare(String(b||''),'pt-BR',{numeric:true,sensitivity:'base'});function sortFieldRows(){[...$('fields').children].sort((a,b)=>fieldCmp(a.querySelector('.fn').value,b.querySelector('.fn').value)).forEach(r=>$('fields').appendChild(r))}function addField(v={}){const row=document.createElement('div');row.className='fieldrow';row.innerHTML=`<input class="fn" placeholder="Nome do talhão" value="${esc(v.name)}"><input class="fa" inputmode="decimal" placeholder="Área ha" value="${v.area||''}"><button class="danger">×</button>`;row.querySelector('button').onclick=()=>row.remove();row.querySelector('.fn').onchange=sortFieldRows;$('fields').appendChild(row);if(v.name)sortFieldRows()}function open(f){editing=f?f.farm:'';$('modalTitle').textContent=f?'Editar cadastro':'Novo cadastro';$('producer').value=f?.producer||f?.proprietor||'';$('farm').value=f?.farm||'';$('cpf').value=f?.cpf||'';$('address').value=f?.address||'';$('fields').innerHTML='';(f?.fields||[]).forEach(addField);if(!f)addField();sortFieldRows();$('modal').classList.remove('hidden')}$('new').onclick=()=>open();$('close').onclick=$('cancel').onclick=()=>$('modal').classList.add('hidden');$('addField').onclick=()=>addField();$('save').onclick=()=>{sortFieldRows();const obj={producer:$('producer').value.trim(),farm:$('farm').value.trim(),cpf:$('cpf').value.trim(),address:$('address').value.trim(),fields:[...$('fields').children].map(r=>({name:r.querySelector('.fn').value.trim(),area:Number(r.querySelector('.fa').value.replace(',','.'))||0})).filter(x=>x.name)};if(!obj.producer||!obj.farm)return alert('Informe o produtor e a fazenda.');if(editing&&editing.toLowerCase()!==obj.farm.toLowerCase())DoCampoData.removeFarm(editing);DoCampoData.mergeFarm(obj);$('modal').classList.add('hidden');load()};$('search').oninput=render;$('activeTab').onclick=()=>{trash=false;$('activeTab').classList.add('on');$('trashTab').classList.remove('on');$('new').style.display='';load()};$('trashTab').onclick=()=>{trash=true;$('trashTab').classList.add('on');$('activeTab').classList.remove('on');$('new').style.display='none';render()};load()})();</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075f3d"><title>Produtos • Do Campo</title><link rel="stylesheet" href="admin.css"></head><body><header><div class="head"><a class="back" href="index.html">‹</a><img class="logo" src="assets/logo.png"><div><h1>Catálogo de produtos</h1><p>Consultar, cadastrar e manter os produtos offline</p></div></div></header><main><div class="tabs"><button id="activeTab" class="secondary on">Produtos ativos</button><button id="trashTab" class="secondary">Excluídos</button></div><div class="toolbar"><input id="search" placeholder="Pesquisar nome, categoria, alvo ou ingrediente"><button id="new" class="primary">+ Cadastrar novo produto</button></div><div id="list" class="list"></div></main>
<div class="importbar"><button id="importBulk" class="secondary">↑ Importar planilha</button><a class="secondary" href="assets/Modelo_Importacao_SmartFarm.xlsx" download="Modelo_Importacao_SmartFarm.xlsx">↓ Baixar modelo XLSX</a><input id="importFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden></div><div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Novo produto</h2><button id="close" class="close">×</button></div><div class="notice">Produtos novos ficam marcados como “Cadastro local — conferir” até a validação técnica.</div><div class="grid"><div><label>Categoria *</label><select id="category"><option>Fungicidas</option><option>Fungicidas Protetores</option><option>Inseticida-Acaricida</option><option>Nutricional</option><option>Hormonal</option><option>Adjuvantes</option><option>Pós-emergente - Não Seletivos</option><option>Pós-emergente - Folha Larga (Latifoliada)</option><option>Pós-emergente - Folha Estreita (Gramíneas)</option><option>Pré-emergente - Não Seletivo</option><option>Pré e Pós-Emergente - Não Seletivo</option><option>Adjuvantes / Antideriva / Corretores</option><option>Outros</option></select></div><div><label>Nome comercial *</label><input id="name"></div><div><label>Dose padrão/ha *</label><input id="dose" inputmode="decimal"></div><div><label>Unidade *</label><select id="unit"><option>L/ha</option><option>kg/ha</option><option>mL/ha</option><option>g/ha</option></select></div><div><label>Alvo</label><input id="target"></div><div><label>Ingrediente ativo / garantia</label><input id="active"></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button id="cancel" class="secondary">Cancelar</button><button id="save" class="primary">Salvar produto</button></div></div></div>
<script src="unified-db.js"></script><script src="shared-data.js"></script><script src="herbicide-catalog.js"></script><script src="registry-loader.js"></script><script src="bulk-import.js"></script><script src="app-shell.js"></script><script>(function(){'use strict';const $=id=>document.getElementById(id),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let items=[],editing=null,trash=false;
async function load(){const d=await DoCampoRegistry.all();items=Object.entries(d.products).flatMap(([category,list])=>(list||[]).map(product=>({category,...product}))).sort((a,b)=>String(a.name).localeCompare(String(b.name),'pt-BR'));render()}function render(){const q=$('search').value.toLowerCase();if(trash){const a=DoCampoDB.list('products',{deleted:true}).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(x=>`<div class="card"><div class="row"><div class="grow"><h2>${esc(x.name)}</h2><p class="meta">${esc(x.category)} • excluído em ${new Date(x.deletedAt).toLocaleDateString('pt-BR')}</p></div><button class="secondary" data-restore="${x.id}">Recuperar</button></div></div>`).join(''):'<div class="empty">Nenhum produto excluído.</div>';$('list').querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{DoCampoData.restoreProduct(b.dataset.restore);load()});return}const a=items.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));$('list').innerHTML=a.length?a.map((p,i)=>`<div class="card"><div class="row"><div class="grow"><h2>${esc(p.name)}</h2><p class="meta"><b>${esc(p.category)}</b> • ${Number(p.dose)||0} ${esc(p.unit)}${p.target?' • Alvo: '+esc(p.target):''}${p.active?' • '+esc(p.active):''}</p>${p.verified===false?'<div class="notice" style="margin:8px 0 0">Cadastro local — conferir</div>':''}</div></div><div class="actions"><button class="secondary" data-edit="${i}">Editar</button><button class="danger" data-del="${i}">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhum produto encontrado.</div>';$('list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(a[b.dataset.edit]));$('list').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const p=a[b.dataset.del];if(confirm('Excluir '+p.name+'? O produto poderá ser recuperado.')){DoCampoData.removeProduct(p.category,p.name);load()}})}
function open(p){editing=p?{category:p.category,name:p.name}:null;$('modalTitle').textContent=p?'Editar produto':'Cadastrar novo produto';$('category').value=p?.category||'Fungicidas';$('name').value=p?.name||'';$('dose').value=p?.dose||'';$('unit').value=p?.unit||'L/ha';$('target').value=p?.target||'';$('active').value=p?.active||'';$('modal').classList.remove('hidden')}$('new').onclick=()=>open();$('close').onclick=$('cancel').onclick=()=>$('modal').classList.add('hidden');$('save').onclick=()=>{const p={name:$('name').value.trim(),dose:Number($('dose').value.replace(',','.')),unit:$('unit').value,target:$('target').value.trim(),active:$('active').value.trim(),verified:false};const cat=$('category').value;if(!p.name||!Number.isFinite(p.dose)||p.dose<=0)return alert('Informe o nome e uma dose válida maior que zero.');if(editing&&(editing.category!==cat||editing.name.toLowerCase()!==p.name.toLowerCase()))DoCampoData.removeProduct(editing.category,editing.name);DoCampoData.mergeProduct(cat,p);$('modal').classList.add('hidden');load()};$('search').oninput=render;$('activeTab').onclick=()=>{trash=false;$('activeTab').classList.add('on');$('trashTab').classList.remove('on');$('new').style.display='';load()};$('trashTab').onclick=()=>{trash=true;$('trashTab').classList.add('on');$('activeTab').classList.remove('on');$('new').style.display='none';render()};load()})();</script></body></html>

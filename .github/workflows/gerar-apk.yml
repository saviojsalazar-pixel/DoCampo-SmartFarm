name: Gerar APK Do Campo SmartFarm

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/gerar-apk.yml"

jobs:
  gerar-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar projeto Android
        run: npx cap sync android

      - name: Autorizar Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK
        run: cd android && ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Do-Campo-SmartFarm-APK
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
